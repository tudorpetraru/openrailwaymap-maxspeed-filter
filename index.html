<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rail Maxspeed Filter</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: rgba(250, 252, 255, 0.4);
      --border: rgba(154, 168, 183, 0.6);
      --text: #14202b;
      --muted: #4d5b68;
      --accent: #005fcc;
      --danger: #b3261e;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .panel-header .title { margin: 0; }
    .panel details { margin-top: 12px; font-size: 12px; color: var(--muted); }
    .panel summary { cursor: pointer; padding: 4px 0; }
    .panel {
      position: fixed;
      z-index: 800;
      top: 12px;
      left: 12px;
      width: min(420px, calc(100vw - 76px));
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(12, 28, 44, 0.2);
      backdrop-filter: blur(8px) saturate(135%);
      -webkit-backdrop-filter: blur(8px) saturate(135%);
      padding: 12px 12px 10px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 190px);
      column-gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.25;
    }

    select,
    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 36px;
      padding: 0 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
    }

    select {
      width: 100%;
    }

    button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .secondary-btn {
      background: #f2f4f7;
      color: var(--text);
      border-color: var(--border);
      font-weight: 600;
      height: 32px;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .hint,
    .status,
    .counts {
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
      margin: 4px 0;
    }

    .status {
      border: 1px solid #c6d9f1;
      background: #edf4fb;
      border-radius: 8px;
      padding: 7px 9px;
      min-height: 18px;
    }

    .status.error {
      border-color: #efb4af;
      background: #fff1f0;
      color: var(--danger);
      font-weight: 600;
    }

    .swatches {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
        row-gap: 6px;
      }
    }

    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 14px;
      height: 4px;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <section class="panel">
    <div class="panel-header">
      <h1 class="title">Rail Lines By Max Speed</h1>
      <button id="panelToggle" class="secondary-btn" type="button" aria-expanded="true" aria-controls="panelBody">Collapse</button>
    </div>
    <div id="panelBody">
    <div class="row">
      <label for="threshold">Minimum speed</label>
      <select id="threshold">
        <option value="160" selected>160 km/h</option>
        <option value="200">200 km/h</option>
        <option value="250">250 km/h</option>
        <option value="300">300 km/h</option>
        <option value="350">350 km/h</option>
      </select>
    </div>
    <div class="row">
      <label for="basemapStyle">Background style</label>
      <select id="basemapStyle">
        <option value="subdued" selected>Subdued (rail focus)</option>
        <option value="wikimedia">Geographic Intl</option>
        <option value="standard">Street (Latin labels)</option>
        <option value="dark">Dark muted</option>
        <option value="blank">Blank</option>
      </select>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">World view</p>
    <button id="retryBtn" type="button" class="secondary-btn" hidden>Retry detail data</button>

    <div class="swatches">
      <span class="swatch"><span class="dot" style="background:#1f6fbd"></span>160-199</span>
      <span class="swatch"><span class="dot" style="background:#00a35d"></span>200-249</span>
      <span class="swatch"><span class="dot" style="background:#ff8b00"></span>250-299</span>
      <span class="swatch"><span class="dot" style="background:#c50032"></span>300-349</span>
      <span class="swatch"><span class="dot" style="background:#7a0026"></span>350+</span>
    </div>
    <details>
      <summary>About the map and data</summary>
      <p class="hint">World view estimates speeds from OpenRailwayMap tile colours. Zoom in for tagged speeds and line details. Detail data updates automatically and is cached for 45 days.</p>
      <p id="counts" class="counts"></p>
      <p id="loadDetails" class="hint"></p>
    </details>
    </div>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="rail-data.js"></script>
  <script>
    const thresholdInput = document.getElementById("threshold");
    const retryBtn = document.getElementById("retryBtn");
    const basemapInput = document.getElementById("basemapStyle");
    const statusEl = document.getElementById("status");
    const countsEl = document.getElementById("counts");

    const DETAIL_MIN_ZOOM = 10;
    const ORM_MAXSPEED_TILE_URL = "https://tiles.openrailwaymap.org/maxspeed/{z}/{x}/{y}.png";
    const ORM_MAXSPEED_PALETTE = [
      { speed: 10, rgb: [1, 0, 203] }, { speed: 20, rgb: [0, 30, 203] },
      { speed: 30, rgb: [0, 61, 203] }, { speed: 40, rgb: [0, 91, 203] },
      { speed: 50, rgb: [0, 122, 203] }, { speed: 60, rgb: [0, 152, 203] },
      { speed: 70, rgb: [0, 183, 203] }, { speed: 80, rgb: [0, 203, 193] },
      { speed: 90, rgb: [0, 203, 162] }, { speed: 100, rgb: [0, 203, 132] },
      { speed: 110, rgb: [0, 203, 102] }, { speed: 120, rgb: [0, 203, 71] },
      { speed: 130, rgb: [0, 203, 41] }, { speed: 140, rgb: [0, 203, 10] },
      { speed: 150, rgb: [20, 203, 0] }, { speed: 160, rgb: [51, 203, 0] },
      { speed: 170, rgb: [81, 203, 0] }, { speed: 180, rgb: [112, 203, 0] },
      { speed: 190, rgb: [142, 203, 0] }, { speed: 200, rgb: [173, 203, 0] },
      { speed: 210, rgb: [203, 203, 0] }, { speed: 220, rgb: [203, 173, 0] },
      { speed: 230, rgb: [203, 142, 0] }, { speed: 240, rgb: [203, 112, 0] },
      { speed: 250, rgb: [203, 81, 0] }, { speed: 260, rgb: [203, 51, 0] },
      { speed: 270, rgb: [203, 20, 0] }, { speed: 280, rgb: [203, 0, 7] },
      { speed: 290, rgb: [203, 0, 37] }, { speed: 300, rgb: [203, 0, 68] },
      { speed: 320, rgb: [203, 0, 98] }, { speed: 340, rgb: [203, 0, 129] },
      { speed: 360, rgb: [203, 0, 159] }, { speed: 380, rgb: [203, 0, 189] },
    ];
    const ORM_EXACT_COLOR_TO_SPEED = new Map(
      ORM_MAXSPEED_PALETTE.map((entry) => [((entry.rgb[0] << 16) | (entry.rgb[1] << 8) | entry.rgb[2]), entry.speed]),
    );
    const ORM_COLOR_LOOKUP_CACHE = new Map();
    const MAX_COLOR_DISTANCE = 42 * 42;

    function speedBand(speed) {
      if (speed >= 350) return { min: 350, hex: "#7a0026", rgb: [122, 0, 38] };
      if (speed >= 300) return { min: 300, hex: "#c50032", rgb: [197, 0, 50] };
      if (speed >= 250) return { min: 250, hex: "#ff8b00", rgb: [255, 139, 0] };
      if (speed >= 200) return { min: 200, hex: "#00a35d", rgb: [0, 163, 93] };
      return { min: 160, hex: "#1f6fbd", rgb: [31, 111, 189] };
    }

    function detectSpeedFromPixel(r, g, b) {
      const key = (r << 16) | (g << 8) | b;
      if (ORM_COLOR_LOOKUP_CACHE.has(key)) return ORM_COLOR_LOOKUP_CACHE.get(key);
      if (ORM_EXACT_COLOR_TO_SPEED.has(key)) {
        const value = ORM_EXACT_COLOR_TO_SPEED.get(key);
        ORM_COLOR_LOOKUP_CACHE.set(key, value);
        return value;
      }

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      if ((max > 245 && max - min < 12) || max - min < 18) {
        ORM_COLOR_LOOKUP_CACHE.set(key, null);
        return null;
      }

      let bestSpeed = null;
      let bestDist = Number.POSITIVE_INFINITY;
      for (const entry of ORM_MAXSPEED_PALETTE) {
        const dr = r - entry.rgb[0];
        const dg = g - entry.rgb[1];
        const db = b - entry.rgb[2];
        const dist = (dr * dr) + (dg * dg) + (db * db);
        if (dist < bestDist) {
          bestDist = dist;
          bestSpeed = entry.speed;
        }
      }

      const finalValue = bestDist <= MAX_COLOR_DISTANCE ? bestSpeed : null;
      ORM_COLOR_LOOKUP_CACHE.set(key, finalValue);
      return finalValue;
    }

    function filterMaxspeedTilePixels(data, width, height, threshold) {
      const filtered = new Uint8ClampedArray(data.length);
      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];
        if (alpha === 0) continue;

        const speed = detectSpeedFromPixel(data[i], data[i + 1], data[i + 2]);
        if (!speed || speed < threshold) continue;

        const band = speedBand(speed);
        filtered[i] = band.rgb[0];
        filtered[i + 1] = band.rgb[1];
        filtered[i + 2] = band.rgb[2];
        filtered[i + 3] = alpha;
      }

      // Slightly thicken global lines for readability.
      const thickened = new Uint8ClampedArray(filtered);
      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const idx = ((y * width) + x) * 4;
          if (filtered[idx + 3] === 0) continue;

          const bleedAlpha = Math.max(80, Math.floor(filtered[idx + 3] * 0.65));
          const neighbors = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
          for (const [nx, ny] of neighbors) {
            if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
            const nIdx = ((ny * width) + nx) * 4;
            if (thickened[nIdx + 3] !== 0) continue;
            thickened[nIdx] = filtered[idx];
            thickened[nIdx + 1] = filtered[idx + 1];
            thickened[nIdx + 2] = filtered[idx + 2];
            thickened[nIdx + 3] = bleedAlpha;
          }
        }
      }

      data.set(thickened);
    }

    const map = L.map("map", { preferCanvas: true, zoomControl: true }).setView([54, 15], 4);
    window.__railMap = map;
    map.zoomControl.setPosition("topright");
    const panel = document.querySelector(".panel");
    L.DomEvent.disableClickPropagation(panel);
    L.DomEvent.disableScrollPropagation(panel);
    document.getElementById("panelToggle").addEventListener("click", (event) => {
      const body = document.getElementById("panelBody");
      body.hidden = !body.hidden;
      event.currentTarget.textContent = body.hidden ? "Expand" : "Collapse";
      event.currentTarget.setAttribute("aria-expanded", String(!body.hidden));
    });

    const blankBasemap = L.gridLayer({
      attribution: "Data: OpenStreetMap contributors, Tiles © Esri",
    });
    blankBasemap.createTile = function createBlankTile() {
      const tile = document.createElement("div");
      tile.style.background = "#f3f5f6";
      return tile;
    };

    const latinCityLabelsLight = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: "Labels © Esri",
    });
    const latinCityLabelsDark = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: "Labels © Esri",
    });

    const basemapConfigs = {
      subdued: {
        base: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
          maxZoom: 16,
          attribution: "Data: OpenStreetMap contributors, Tiles © Esri",
        }),
        labels: latinCityLabelsLight,
      },
      wikimedia: {
        base: L.tileLayer("https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "Data: OpenStreetMap contributors, map style: Wikimedia maps",
        }),
        labels: null,
      },
      standard: {
        base: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
          maxZoom: 19,
          attribution: "Data: OpenStreetMap contributors, Tiles © Esri",
        }),
        labels: null,
      },
      dark: {
        base: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
          maxZoom: 16,
          attribution: "Data: OpenStreetMap contributors, Tiles © Esri",
        }),
        labels: latinCityLabelsDark,
      },
      blank: {
        base: blankBasemap,
        labels: latinCityLabelsLight,
      },
    };

    let activeBasemapLayer = null;
    let activeBasemapLabelLayer = null;
    function setBasemapStyle(styleKey) {
      const nextKey = basemapConfigs[styleKey] ? styleKey : "subdued";
      const cfg = basemapConfigs[nextKey];
      if (activeBasemapLayer) {
        map.removeLayer(activeBasemapLayer);
      }
      if (activeBasemapLabelLayer) {
        map.removeLayer(activeBasemapLabelLayer);
      }
      activeBasemapLayer = cfg.base;
      activeBasemapLayer.addTo(map);
      activeBasemapLayer.bringToBack();

      activeBasemapLabelLayer = cfg.labels;
      if (activeBasemapLabelLayer) {
        activeBasemapLabelLayer.addTo(map);
      }
    }
    class FilteredMaxspeedTileLayer extends L.GridLayer {
      initialize(options = {}) {
        super.initialize(options);
        this.threshold = options.threshold || 160;
      }

      setThreshold(threshold) {
        this.threshold = threshold;
        this.redraw();
      }

      createTile(coords, done) {
        const size = this.getTileSize();
        const tile = document.createElement("canvas");
        tile.width = size.x;
        tile.height = size.y;
        const ctx = tile.getContext("2d", { willReadFrequently: true });

        const maxIndex = 2 ** coords.z;
        const wrappedX = ((coords.x % maxIndex) + maxIndex) % maxIndex;
        if (coords.y < 0 || coords.y >= maxIndex) {
          done(null, tile);
          return tile;
        }

        const src = ORM_MAXSPEED_TILE_URL
          .replace("{z}", String(coords.z))
          .replace("{x}", String(wrappedX))
          .replace("{y}", String(coords.y));

        const image = new Image();
        image.crossOrigin = "anonymous";
        image.decoding = "async";
        image.onload = () => {
          try {
            ctx.drawImage(image, 0, 0, size.x, size.y);
            const imageData = ctx.getImageData(0, 0, size.x, size.y);
            filterMaxspeedTilePixels(imageData.data, size.x, size.y, this.threshold);
            ctx.putImageData(imageData, 0, 0);
          } catch (err) {
            ctx.clearRect(0, 0, size.x, size.y);
          }
          done(null, tile);
        };
        image.onerror = () => {
          ctx.clearRect(0, 0, size.x, size.y);
          done(null, tile);
        };
        image.src = src;
        return tile;
      }
    }

    const globalLayer = new FilteredMaxspeedTileLayer({
      threshold: Number(thresholdInput.value),
      maxNativeZoom: 9,
      opacity: 0.92,
      attribution: "Rail data/rendering: OpenRailwayMap",
    }).addTo(map);
    setBasemapStyle(basemapInput.value);
    globalLayer.bringToFront();

    const overlayLayer = L.geoJSON([], {
      style: (feature) => {
        const speed = feature.properties.maxspeed_kmh;
        const color = speedBand(speed).hex;
        return {
          color,
          weight: 4,
          opacity: 0.95,
          lineCap: "round",
          lineJoin: "round",
        };
      },
      onEachFeature: (feature, layer) => {
        const tags = feature.properties.tags;
        const preferredName = getPreferredLatinName(tags);
        const popup = [
          preferredName ? `name: <strong>${preferredName}</strong>` : null,
          `Max speed (computed): <strong>${feature.properties.maxspeed_kmh} km/h</strong>`,
          tags.maxspeed ? `maxspeed: ${tags.maxspeed}` : null,
          tags["maxspeed:forward"] ? `maxspeed:forward: ${tags["maxspeed:forward"]}` : null,
          tags["maxspeed:backward"] ? `maxspeed:backward: ${tags["maxspeed:backward"]}` : null,
          tags.railway ? `railway: ${tags.railway}` : null,
          tags.usage ? `usage: ${tags.usage}` : null,
          tags.ref ? `ref: ${tags.ref}` : null,
        ].filter(Boolean);
        layer.bindPopup(popup.join("<br>"));
      },
    });

    const overpassEndpoints = [
      "https://overpass-api.de/api/interpreter",
      "https://lz4.overpass-api.de/api/interpreter",
      "https://z.overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
    ];
    const MAX_BBOX_AREA = 20;
    const MAX_VISIBLE_CELLS = 100;
    const CACHE_TTL_MS = 45 * 24 * 60 * 60 * 1000;
    const CACHE_DB_NAME = "rail-maxspeed-cache-v1";
    const CACHE_DB_VERSION = 1;
    const CACHE_STORE_NAME = "queries";
    const PREFETCH_MIN_INTERVAL_MS = 45 * 1000;

    let lastLoadedFeatures = [];
    let isLoading = false;
    let loadController = null;
    let loadGeneration = 0;
    let detailReady = false;
    const memoryCache = new Map();
    let detailLoadFailed = false;
    let autoReloadTimer = null;

    let prefetchTimer = null;
    let lastPrefetchAt = 0;
    let cacheDbPromise = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? "status error" : "status";
    }

    function setCounts(total, visible) {
      countsEl.textContent = `Loaded: ${total} railway ways | Visible: ${visible}`;
    }

    function updateRetryButton() {
      retryBtn.hidden = !(isDetailMode() && detailLoadFailed && !isLoading);
    }

    function isDetailMode() {
      return map.getZoom() >= DETAIL_MIN_ZOOM;
    }

    function updateModeUI() {
      const detailMode = isDetailMode();
      globalLayer.setOpacity(detailMode && detailReady ? 0 : 0.92);
      if (detailMode) {
        if (!map.hasLayer(overlayLayer)) {
          map.addLayer(overlayLayer);
        }
        updateRetryButton();
        return;
      }

      if (map.hasLayer(overlayLayer)) {
        map.removeLayer(overlayLayer);
      }
      detailLoadFailed = false;
      updateRetryButton();
      setCounts(0, 0);
      if (!isLoading) {
        setStatus("World view. Zoom in for line details.");
      }
    }

    function boundsArea(bounds) {
      return Math.abs((bounds.getNorth() - bounds.getSouth()) * (bounds.getEast() - bounds.getWest()));
    }

    const isCacheFresh = RailData.fresh;

    function getCacheDb() {
      if (!("indexedDB" in window)) return Promise.resolve(null);
      if (cacheDbPromise) return cacheDbPromise;

      cacheDbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(CACHE_DB_NAME, CACHE_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          const store = db.createObjectStore(CACHE_STORE_NAME, { keyPath: "key" });
          store.createIndex("timestamp", "timestamp", { unique: false });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Cache unavailable"));
      });

      return cacheDbPromise;
    }

    async function diskGet(key) {
      const db = await getCacheDb();
      if (!db) return null;

      return new Promise((resolve, reject) => {
        const tx = db.transaction(CACHE_STORE_NAME, "readonly");
        const store = tx.objectStore(CACHE_STORE_NAME);
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    async function diskPut(key, elements) {
      const db = await getCacheDb();
      if (!db) return;

      return new Promise((resolve, reject) => {
        const tx = db.transaction(CACHE_STORE_NAME, "readwrite");
        const store = tx.objectStore(CACHE_STORE_NAME);
        store.put({
          key,
          timestamp: Date.now(),
          elements,
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function cacheGet(key) {
      if (memoryCache.has(key)) return memoryCache.get(key);
      return optionalStorage(() => diskGet(key), null);
    }

    async function optionalStorage(work, fallback) {
      let timeout;
      try {
        return await Promise.race([
          Promise.resolve().then(work),
          new Promise(resolve => { timeout = setTimeout(() => resolve(fallback), 1500); }),
        ]);
      } catch { return fallback; }
      finally { clearTimeout(timeout); }
    }

    async function cachePut(key, elements) {
      memoryCache.delete(key);
      memoryCache.set(key, { key, timestamp: Date.now(), elements });
      if (memoryCache.size > 160) memoryCache.delete(memoryCache.keys().next().value);
      await optionalStorage(() => diskPut(key, elements));
    }

    async function cleanupExpiredCache() {
      const db = await getCacheDb();
      if (!db) return;

      const cutoff = Date.now() - CACHE_TTL_MS * 2;
      return new Promise((resolve, reject) => {
        const tx = db.transaction(CACHE_STORE_NAME, "readwrite");
        const store = tx.objectStore(CACHE_STORE_NAME);
        const index = store.index("timestamp");
        const request = index.openCursor();
        request.onsuccess = (event) => {
          const cursor = event.target.result;
          if (!cursor) return;
          if (cursor.value.timestamp < cutoff) {
            cursor.delete();
          }
          cursor.continue();
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function parseSpeedValueToKmh(raw) {
      if (!raw || typeof raw !== "string") return [];

      return raw
        .split(";")
        .map((part) => part.trim().toLowerCase())
        .flatMap((part) => {
          const match = part.match(/^(\d+(?:\.\d+)?)\s*(mph|mi\/h|km\/h|kmh|kph)?$/i);
          if (!match) return [];
          const value = Number(match[1]);
          if (!Number.isFinite(value)) return [];

          const unit = (match[2] || "km/h").toLowerCase();
          if (unit === "mph" || unit === "mi/h") {
            return [Math.round(value * 1.609344)];
          }
          return [Math.round(value)];
        });
    }

    function computeMaxspeedKmh(tags) {
      const values = [
        ...parseSpeedValueToKmh(tags.maxspeed),
        ...parseSpeedValueToKmh(tags["maxspeed:forward"]),
        ...parseSpeedValueToKmh(tags["maxspeed:backward"]),
      ];

      if (!values.length) return null;
      return Math.max(...values);
    }

    function getPreferredLatinName(tags) {
      if (!tags) return null;
      const preferredKeys = [
        "name:en",
        "int_name",
        "name:latin",
        "official_name:en",
        "short_name:en",
        "name",
      ];
      for (const key of preferredKeys) {
        if (tags[key]) return tags[key];
      }
      return null;
    }

    function formatLoadMeta(meta) {
      if (!meta) return "";
      const parts = [];
      if (meta.cache > 0) parts.push(`${meta.cache} cached`);
      if (meta.network > 0) parts.push(`${meta.network} live`);
      if (meta.staleCache > 0) parts.push(`${meta.staleCache} stale-fallback`);
      return parts.length ? ` (${parts.join(", ")})` : "";
    }

    function renderByThreshold(loadMeta = null) {
      if (!isDetailMode()) {
        updateModeUI();
        return;
      }

      const threshold = Number(thresholdInput.value);
      const visible = lastLoadedFeatures.filter((feature) => feature.properties.maxspeed_kmh >= threshold);
      overlayLayer.clearLayers();
      overlayLayer.addData(visible);
      setCounts(lastLoadedFeatures.length, visible.length);
      if (loadMeta) document.getElementById("loadDetails").textContent = formatLoadMeta(loadMeta);
      if (!isLoading && !detailLoadFailed) {
        setStatus(visible.length ? `Showing ${visible.length} lines at ${threshold}+ km/h` : "No matching detailed lines in this area.");
      }
    }

    function buildOverpassQuery(bounds) {
      const s = bounds.getSouth();
      const w = bounds.getWest();
      const n = bounds.getNorth();
      const e = bounds.getEast();

      return `[out:json][timeout:30];
(
  way["railway"~"^(rail|light_rail|subway|tram|narrow_gauge)$"]["maxspeed"](${s},${w},${n},${e});
  way["railway"~"^(rail|light_rail|subway|tram|narrow_gauge)$"]["maxspeed:forward"](${s},${w},${n},${e});
  way["railway"~"^(rail|light_rail|subway|tram|narrow_gauge)$"]["maxspeed:backward"](${s},${w},${n},${e});
);
out tags geom;`;
    }

    function validateViewport(bounds) {
      const area = boundsArea(bounds);
      if (area > MAX_BBOX_AREA) {
        return "Viewport is too large. Zoom in a bit more and retry.";
      }
      return null;
    }

    function cellBounds(cell) {
      return L.latLngBounds([cell.south, cell.west], [cell.north, cell.east]);
    }

    async function postOverpass(endpoint, query, signal) {
      signal.throwIfAborted();
      const controller = new AbortController();
      const abort = () => controller.abort();
      signal.addEventListener("abort", abort, { once: true });
      const timeout = setTimeout(abort, 18000);
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
          body: new URLSearchParams({ data: query }), signal: controller.signal,
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.remark || !Array.isArray(data.elements)) throw new Error(data.remark || "Incomplete response");
        return data.elements;
      } finally {
        clearTimeout(timeout);
        signal.removeEventListener("abort", abort);
      }
    }

    async function fetchCell(cell, signal, cached) {
      let lastError;
      for (const endpoint of overpassEndpoints) {
        signal.throwIfAborted();
        try {
          const elements = await postOverpass(endpoint, buildOverpassQuery(cellBounds(cell)), signal);
          signal.throwIfAborted();
          await cachePut(cell.key, elements);
          return { elements, source: "network" };
        } catch (error) {
          signal.throwIfAborted();
          lastError = error;
        }
      }
      if (cached && Array.isArray(cached.elements)) return { elements: cached.elements, source: "staleCache" };
      throw lastError;
    }

    function schedulePrefetch(cells, signal) {
      if (Date.now() - lastPrefetchAt < PREFETCH_MIN_INTERVAL_MS) return;
      prefetchTimer = setTimeout(async () => {
        lastPrefetchAt = Date.now();
        try {
          for (const cell of RailData.neighbors(cells).slice(0, 2)) {
            signal.throwIfAborted();
            const cached = await cacheGet(cell.key);
            if (!isCacheFresh(cached)) await fetchCell(cell, signal, cached);
          }
        } catch { /* Prefetch is optional and stops on navigation or failure. */ }
      }, 1200);
    }

    function overpassToGeoJSON(overpassElements) {
      const seen = new Set();
      const features = [];

      for (const el of overpassElements) {
        if (el.type !== "way" || !Array.isArray(el.geometry)) continue;
        if (seen.has(el.id)) continue;
        seen.add(el.id);

        const tags = el.tags || {};
        const maxspeedKmh = computeMaxspeedKmh(tags);
        if (maxspeedKmh === null) continue;

        const coordinates = el.geometry.map((pt) => [pt.lon, pt.lat]);
        if (coordinates.length < 2) continue;

        features.push({
          type: "Feature",
          geometry: { type: "LineString", coordinates },
          properties: {
            osm_id: el.id,
            maxspeed_kmh: maxspeedKmh,
            tags,
          },
        });
      }

      return features;
    }

    function cancelLoading() {
      loadGeneration++;
      if (loadController) loadController.abort();
      clearTimeout(autoReloadTimer);
      clearTimeout(prefetchTimer);
      isLoading = false;
      detailReady = false;
      updateModeUI();
    }

    async function loadDataInView() {
      cancelLoading();
      if (!isDetailMode()) return;
      const bounds = map.getBounds();
      const cells = RailData.cellsForBounds({ south: bounds.getSouth(), west: bounds.getWest(),
        north: bounds.getNorth(), east: bounds.getEast() });
      if (validateViewport(bounds) || cells.length > MAX_VISIBLE_CELLS) {
        setStatus("Zoom in a little more for line details.");
        return;
      }
      const generation = loadGeneration;
      loadController = new AbortController();
      const { signal } = loadController;
      const current = () => generation === loadGeneration && !signal.aborted;
      isLoading = true;
      detailLoadFailed = false;
      updateRetryButton();
      setStatus("Loading line details...");
      const results = new Map();
      const meta = { cache: 0, network: 0, staleCache: 0 };
      let failed = 0;
      const showResults = (complete = false) => {
        if (!current()) return;
        const features = overpassToGeoJSON([...results.values()].flat());
        // Preserve previous geometry until the new viewport has complete coverage.
        lastLoadedFeatures = complete ? features : [...new Map(
          [...lastLoadedFeatures, ...features].map(f => [f.properties.osm_id, f])).values()];
        renderByThreshold(meta);
      };
      try {
        const cached = await Promise.all(cells.map(cell => cacheGet(cell.key)));
        if (!current()) return;
        const missing = [];
        cells.forEach((cell, i) => {
          if (isCacheFresh(cached[i])) {
            results.set(cell.key, cached[i].elements);
            meta.cache++;
          } else missing.push({ cell, cached: cached[i] });
        });
        if (results.size) showResults();
        await RailData.pool(missing, 2, signal, async ({ cell, cached }) => {
          try {
            const result = await fetchCell(cell, signal, cached);
            if (!current()) return;
            results.set(cell.key, result.elements);
            meta[result.source]++;
            showResults();
            setStatus(`Loading line details: ${results.size}/${cells.length} areas`);
          } catch (error) {
            signal.throwIfAborted();
            failed++;
            document.getElementById("loadDetails").textContent = error.message;
          }
        });
        if (!current()) return;
        isLoading = false;
        detailLoadFailed = failed > 0 || meta.staleCache > 0;
        detailReady = !detailLoadFailed;
        showResults(failed === 0);
        if (detailLoadFailed) setStatus(failed ? "Some details could not load. Showing available lines." : "Offline data shown. Some details may be outdated.", true);
        else schedulePrefetch(cells, signal);
      } catch (error) {
        if (!current()) return;
        detailLoadFailed = true;
        setStatus("Details unavailable. You can retry.", true);
      } finally {
        if (current()) {
          isLoading = false;
          updateModeUI();
        }
      }
    }

    function handleMapMoveEnd() {
      cancelLoading();
      if (isDetailMode()) {
        setStatus("Loading line details...");
        autoReloadTimer = setTimeout(loadDataInView, 350);
      }
    }

    map.on("movestart", cancelLoading);
    retryBtn.addEventListener("click", () => loadDataInView("manual"));
    map.on("moveend", handleMapMoveEnd);
    basemapInput.addEventListener("change", () => {
      setBasemapStyle(basemapInput.value);
      globalLayer.bringToFront();
      if (map.hasLayer(overlayLayer)) {
        overlayLayer.bringToFront();
      }
    });
    thresholdInput.addEventListener("change", () => {
      globalLayer.setThreshold(Number(thresholdInput.value));
      if (isDetailMode()) {
        renderByThreshold();
      } else {
        updateModeUI();
      }
    });
    cleanupExpiredCache().catch(() => {});
    updateModeUI();
    loadDataInView("auto");
  </script>
</body>
</html>
